name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Full data sync + commit + Vercel deploy every 6 hours.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping full syncs (and builds) from interfering with each other.
concurrency:
  group: dsh-plugin-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The scheduled/manual runs commit the refreshed plugins.json back to the
    # repository, so they need write access; PR runs stay read-only.
    permissions:
      contents: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'write' || 'read' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real GitHub data sync runs only on schedule or manual dispatch, and is
      # the only step that uses a token. Regular pushes/PRs stay offline. The
      # sync step also commits any change to plugins.json and triggers a Vercel
      # deploy via the VERCEL_DEPLOY_HOOK_URL secret.
      - name: Sync data (schedule/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: npm run sync

      # Push the data commit made by the sync step so the repository (and any
      # provider that builds from the branch) reflects the latest snapshot.
      - name: Push data commit (schedule/manual only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse @{u})" ]; then
            git push origin HEAD:main
          else
            echo "No new commits to push."
          fi

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-hub-dist
          path: dist/
          if-no-files-found: error
