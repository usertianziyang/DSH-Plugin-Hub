name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Prevent overlapping builds from interfering with each other.
concurrency:
  group: dsh-plugin-hub-ci
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-plugin-hub-dist
          path: dist/
          if-no-files-found: error
